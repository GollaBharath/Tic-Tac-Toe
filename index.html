<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tic Tac Toe</title>
		<link rel="stylesheet" href="./styles.css" />
		<script src="./script.js" defer></script>
	</head>
	<body>
		<p>Tic Tac Toe</p>
		<dialog open>
			<p>Enter Player Names</p>
			<form method="dialog">
				<label for="p1"
					><input type="text" id="p1" placeholder="Player-1's name" required
				/></label>
				<label for="p2"
					><input type="text" id="p2" placeholder="Player-2's name" required
				/></label>
				<button onclick="getNames()">OK</button>
			</form>
		</dialog>
	</body>
</html>
